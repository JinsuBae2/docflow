name: 기능 제안
description: 해결하고 싶은 문제와 사용 상황을 알려 주세요.
title: '[제안] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제
      description: 어떤 작업 중 어떤 불편이 있나요?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 제안과 완료 기준
      description: 원하는 동작과 해결됐다고 판단할 기준을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
